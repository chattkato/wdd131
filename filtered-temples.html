<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="Explore temples with filtering options by age and size.">
  <meta name="author" content="Your Name">

  <title>Temple Album</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles/filtered-temples.css">

  <!-- JS -->
  <script defer src="scripts/filtered-temples.js"></script>
</head>

<body>

  <!-- HEADER (REQUIRED: must contain "Temple Album") -->
  <header>
    <h1>Temple Album</h1>

    <nav aria-label="Temple Navigation">
      <ul>
        <li><a href="#" id="home">Home</a></li>
        <li><a href="#" id="old">Old</a></li>
        <li><a href="#" id="new">New</a></li>
        <li><a href="#" id="large">Large</a></li>
        <li><a href="#" id="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <!-- This is where JS injects temple cards -->
    <section id="cards" class="grid" aria-live="polite"></section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; <span id="year"></span> Temple Album</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

</body>
</html>
