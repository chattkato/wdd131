<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Requirements -->
    <meta name="description" content="Discover Nigeria, a vibrant West African country known for its rich culture, history, and beautiful landscapes.">
    <meta name="author" content="Your Full Name">

    <title>Discover Nigeria</title>

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>

<header>
    <h1>Nigeria</h1>
</header>

<!-- HERO IMAGE -->
<section class="hero">
    <!-- Hidden heading for accessibility -->
    <h2 class="visually-hidden">Nigeria Landscape</h2>

    <picture>
        <source srcset="images/nigeria-large.webp" media="(min-width: 768px)">
        <img src="images/nigeria-small.webp" alt="Nigeria landscape">
    </picture>
</section>

<main>

    <!-- ABOUT -->
    <section class="about">
        <h2>About Nigeria</h2>
        <p>
            Nigeria is a vibrant country in West Africa known for its diverse culture,
            rich history, and strong economy. It is often called the Giant of Africa.
        </p>
    </section>

    <!-- WEATHER -->
    <section class="weather">
        <h2>Weather</h2>

        <!-- SVG Icon for mobile -->
        <div class="weather-icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="orange" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="5"/>
                <g stroke="orange" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="4"/>
                    <line x1="12" y1="20" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
                    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="4" y2="12"/>
                    <line x1="20" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
                    <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                </g>
            </svg>
        </div>

        <p>Temperature: <span id="temp">28</span>°C</p>
        <p>Wind Speed: <span id="wind">10</span> km/h</p>
        <p>Wind Chill: <span id="windChill"></span></p>
    </section>

</main>

<footer>
    <p>&copy; <span id="year"></span> | Last Modified: <span id="lastModified"></span></p>
</footer>

</body>
</html>
